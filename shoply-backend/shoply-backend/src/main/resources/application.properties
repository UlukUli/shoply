spring.application.name=shoply-backend
server.port=8080

# Встроенная база данных H2 с сохранением в файл
spring.datasource.url=jdbc:h2:file:./data/shoplydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Веб-консоль базы данных для проверки таблиц
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Кодировка UTF-8 для корректного отображения кириллицы
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true